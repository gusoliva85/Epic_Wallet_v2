# ============================================================
#  Alembic · migraciones de Epic Wallet 2.0
#
#  La URL de la base y el esquema NO se escriben acá: los lee
#  migrations/env.py del entorno (DATABASE_URL y DB_SCHEMA).
#  DB_SCHEMA es obligatorio y no tiene valor por defecto, para que
#  una migración no pueda caer en el esquema equivocado.
#
#  Uso:
#    DB_SCHEMA=dev    alembic upgrade head
#    DB_SCHEMA=dev    alembic revision --autogenerate -m "mensaje"
#    DB_SCHEMA=public alembic upgrade head      (producción)
# ============================================================

[alembic]
script_location = migrations
prepend_sys_path = api
path_separator = os

# Nombre de los archivos de migración: fecha + revisión + descripción.
# Así el orden alfabético coincide con el cronológico.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Las fechas de los archivos en hora local de Buenos Aires.
timezone = America/Argentina/Buenos_Aires

# Formatear la migración generada con ruff, para que pase el lint.
hooks = ruff_format, ruff_fix
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
