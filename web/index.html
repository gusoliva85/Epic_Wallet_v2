<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- La barra de estado de Android acompaña al tema. -->
<meta name="theme-color" content="#f1f2f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0d0e" media="(prefers-color-scheme: dark)">

<title>Epic Wallet</title>
<meta name="description" content="Aplicación personal de gestión financiera.">
<meta name="color-scheme" content="light dark">

<!-- Fuentes: preconnect para adelantar el handshake, display=swap para
     que el texto se vea desde el primer frame con la fuente del sistema. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style"
  href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">

<link rel="stylesheet" href="/public/app.css">
</head>
<body>

<main class="pantalla">
  <section class="tarjeta shell">
    <span class="marca" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 8.5A2.5 2.5 0 015.5 6H19a2 2 0 012 2v9a2 2 0 01-2 2H5.5A2.5 2.5 0 013 16.5v-8z"/>
        <path d="M3 9.5h13.5a1.5 1.5 0 011.5 1.5v3a1.5 1.5 0 01-1.5 1.5H3"/>
        <circle cx="7" cy="12.5" r="1.1"/>
      </svg>
    </span>

    <h1>Epic Wallet</h1>
    <p class="bajada">Gestión financiera personal</p>

    <div class="regla" aria-hidden="true"></div>

    <div class="fichas">
      <div class="ficha cg">
        <span>Fase</span>
        <b>0</b>
      </div>
      <div class="ficha cg">
        <span>Entorno</span>
        <b>Producción</b>
      </div>
    </div>

    <p class="pie">
      La aplicación está en construcción.<br>
      Estado del servicio en <code>/api/health</code>.
    </p>
  </section>
</main>

</body>
</html>
