<title>Epic Wallet</title>
<!--

<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;
    background:#f1f2f3;color:#1c2024;
    font:16px/1.6 system-ui,-apple-system,sans-serif;padding:24px}
  main{max-width:420px;text-align:center}
  h1{font-size:26px;letter-spacing:-.02em;margin:0 0 6px}
  p{color:#7c828a;font-size:14px;margin:0 0 24px}
  .estado{border:1px solid rgba(28,32,36,.1);border-radius:16px;padding:16px;
    background:#fff;text-align:left;font-size:13px}
  .estado b{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;
    color:#7c828a;margin-bottom:8px}
  code{font-family:ui-monospace,monospace;font-size:12px;color:#3e5a6d;
    word-break:break-all;white-space:pre-wrap}
  @media(prefers-color-scheme:dark){
    body{background:#0c0d0e;color:#eef0f1}
    .estado{background:#16191c;border-color:rgba(238,240,241,.1)}
    code{color:#9bc0d4}
  }
</style>
</head>
<body>
<main>
  <h1>Epic Wallet</h1>
  <p>Gestión financiera personal · en construcción</p>
  <div class="estado">
    <b>Estado de la API</b>
    <code id="salud">consultando…</code>
  </div>
</main>
<script type="module">
  const salida = document.getElementById("salud");
  try {
    const r = await fetch("/api/health");
    const d = await r.json();
    salida.textContent = JSON.stringify(d, null, 2);
  } catch (err) {
    salida.textContent = "No se pudo consultar /api/health\n" + err.message;
  }
</script>
</body>
